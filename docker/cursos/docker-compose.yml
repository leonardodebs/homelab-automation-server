services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: cursos-caddy
    restart: unless-stopped
    ports:
      - "192.168.15.3:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /CURSOS:/srv/cursos:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
