services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - portainer-net

  caddy:
    image: caddy:2.11.4-alpine
    container_name: portainer-caddy
    restart: unless-stopped
    ports:
      - "192.168.15.3:9443:9443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - portainer-net

volumes:
  portainer_data:
  caddy_data:
  caddy_config:

networks:
  portainer-net:
