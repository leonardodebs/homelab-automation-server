global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # O próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas do servidor (CPU, RAM, disco, rede)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas dos containers Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Métricas do PostgreSQL do n8n
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
